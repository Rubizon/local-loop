<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>local-loop</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header>
    <strong>local-loop</strong>
    <span class="quiet" id="chipModel">model</span>
    <span class="quiet" id="chipCwd"></span>
    <span class="spacer"></span>
    <button type="button" id="test" class="ghost">Test model</button>
    <button type="button" id="export" class="ghost">Export</button>
    <button type="button" id="clear" class="ghost">Clear</button>
  </header>
  <main>
    <section id="thread">
      <div id="chat"></div>
      <footer>
        <div class="composer" id="composer">
          <div class="files" id="files"></div>
          <textarea id="input" rows="1" placeholder="Message, or drop a file"></textarea>
          <div class="composer-bar">
            <button type="button" id="copyDraft" class="tiny ghost">Copy</button>
            <span id="budget" class="meter">~0</span>
            <button class="send" type="button" id="send" aria-label="Send">↑</button>
          </div>
        </div>
      </footer>
    </section>
    <aside>
      <div class="aside-h">
        <h2>State</h2>
        <button type="button" id="lockState" class="icon-lock" aria-label="Unlock to edit" title="Unlock to edit"></button>
      </div>
      <p class="hint">The only memory. The model sees this text, not the chat. About 12 lines.</p>
      <pre id="ctx">(empty)</pre>
      <textarea id="ctxEdit" hidden spellcheck="false" aria-label="State"></textarea>
    </aside>
  </main>
  <script src="/format.js"></script>
  <script src="/app.js"></script>
</body>
</html>
