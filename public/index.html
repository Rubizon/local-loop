<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loop</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header>
    <strong>Loop</strong>
    <span class="quiet" id="chipModel">model</span>
    <span class="quiet" id="chipCwd"></span>
    <span class="spacer"></span>
    <button type="button" id="test" class="ghost">Test model</button>
    <button type="button" id="clear" class="ghost">Clear</button>
  </header>
  <main>
    <section id="thread">
      <div id="chat"></div>
      <footer>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Message"></textarea>
          <div class="composer-bar">
            <span id="budget" class="meter">~0</span>
            <button class="send" type="button" id="send" aria-label="Send">↑</button>
          </div>
        </div>
      </footer>
    </section>
    <aside>
      <h2>State</h2>
      <p class="hint">The only memory. The model sees this text, not the chat.</p>
      <pre id="ctx">(empty)</pre>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
