<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>local-loop</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header>
    <div class="brand">
      <strong>local-loop</strong>
      <span class="chip" id="chipModel">model</span>
      <span class="chip" id="chipCwd">cwd</span>
    </div>
    <div class="modes" id="modes">
      <button type="button" data-mode="A" class="on">Direct</button>
      <button type="button" data-mode="B">Plan</button>
    </div>
    <span id="status" class="status"></span>
    <div class="header-actions">
      <button type="button" id="test">Self-test</button>
      <button type="button" id="clear">Clear</button>
    </div>
  </header>
  <main>
    <section id="thread">
      <div id="chat"></div>
      <footer>
        <textarea id="input" placeholder="Direct: one answer, maybe one command. Plan: a task tree. Nothing is stored until Add."></textarea>
        <div class="composer-bar">
          <span id="budget" class="meter">~0 / 8192</span>
          <span class="hint" id="modeHint">Direct · Enter send</span>
          <button class="ok" type="button" id="send">Send</button>
        </div>
      </footer>
    </section>
    <aside>
      <h2>Working context</h2>
      <p class="hint">Always visible. Rewritten in full on Add. Drop a line by asking. KEEP survives.</p>
      <pre id="ctx">(empty)</pre>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
